name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build, test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check committed client bundle
        run: pnpm run check
      - name: Run unit tests
        run: pnpm test
      - name: Configure bounded Ubuntu package downloads
        timeout-minutes: 1
        run: |
          # The runner's Azure HTTP mirror stalled the previous apt update.
          # Keep the same Ubuntu packages, using the official HTTPS archive.
          sudo python3 - <<'PY'
          from pathlib import Path
          import re
          paths = [Path('/etc/apt/apt-mirrors.txt'), Path('/etc/apt/sources.list')]
          paths += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          paths += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for path in paths:
              if path.is_file():
                  original = path.read_text()
                  updated = re.sub(r'https?://azure\.archive\.ubuntu\.com/ubuntu', 'https://archive.ubuntu.com/ubuntu', original)
                  if updated != original:
                      path.write_text(updated)
                      print(f'Updated Ubuntu mirror in {path}')
          Path('/etc/apt/apt.conf.d/80-dsh-downloads').write_text(
              'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n'
          )
          PY
      - name: Install Chromium system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install-deps chromium
      - name: Install Chromium headless shell
        timeout-minutes: 5
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: pnpm exec playwright install --only-shell chromium
      - name: Run browser checks
        timeout-minutes: 3
        run: pnpm run test:browser
      - name: Pack and verify installable archive
        run: |
          pnpm pack --pack-destination dist
          pnpm run check:package
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload verified installation package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installation-package-${{ github.sha }}
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish requested version
    needs: verify
    if: "github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installation-package-${{ github.sha }}
          path: dist
      - name: Publish the package from this successful verification job
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
